name: Auto update

on:
  schedule:
    - cron: '17 5 * * *'   # daily: merge upstream rvben/unifi-cli
    - cron: '17 6 * * 1'   # weekly (Mon): also bump flake.lock
  workflow_dispatch:

# Pushes commits to main; nothing else.
permissions:
  contents: write

# One workflow, one push path: daily merge and weekly lock bump must not race.
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      sha: ${{ steps.changed.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # merge-base / merge need full history
          # persist-credentials defaults to true: this job git-pushes to main.
          # Checkout defaults to the event SHA. Weekly runs queue behind daily
          # (cancel-in-progress: false); without resolving main at job start
          # they would build on a stale tip, the non-force promote would reject,
          # and the lock bump would be lost until next week.
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream rvben/unifi-cli
        run: |
          git remote add upstream https://github.com/rvben/unifi-cli.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "upstream/main is already an ancestor of HEAD; skip merge"
            exit 0
          fi
          # We deleted release.yml and upd.yml deliberately; upstream keeps
          # editing them, so every sync that touches either is a modify/delete
          # conflict with a single correct resolution (keep them gone).
          # Auto-resolve ONLY a non-empty subset of those two paths. Never
          # -X ours or || true: that would silently discard real upstream
          # changes. Any other unmerged path (including those two plus
          # anything else) aborts for a human.
          if git merge --no-edit upstream/main; then
            echo "merged upstream/main"
            exit 0
          fi
          mapfile -t unmerged < <(git diff --name-only --diff-filter=U)
          unexpected=0
          if [ "${#unmerged[@]}" -eq 0 ]; then
            unexpected=1
          fi
          for path in "${unmerged[@]}"; do
            case "$path" in
              .github/workflows/release.yml|.github/workflows/upd.yml) ;;
              *) unexpected=1 ;;
            esac
          done
          if [ "$unexpected" -ne 0 ]; then
            echo "merge conflict is not confined to deleted fork-hostile workflows:" >&2
            printf '%s\n' "${unmerged[@]}" >&2
            git merge --abort
            exit 1
          fi
          echo "re-deleting expected modify/delete conflicts:"
          printf '%s\n' "${unmerged[@]}"
          git rm -f -- "${unmerged[@]}"
          git commit --no-edit

      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
        # Only the weekly lock bump needs Nix in this job; the verify matrix
        # installs its own. Daily merge-only runs skip the install/teardown.
        if: github.event.schedule != '17 5 * * *'

      - name: Update flake.lock
        # Skip on the daily cron: nixpkgs-unstable moves daily and daily lock
        # bumps would spam consumers with rebuilds, while upstream code changes
        # must land promptly.
        if: github.event.schedule != '17 5 * * *'
        run: |
          nix flake update
          git diff --quiet flake.lock || git commit -m "flake.lock: update inputs" -- flake.lock

      - name: Detect changes to push
        id: changed
        # Compare revisions, not trees: a new commit with an identical tree
        # must still be promoted, or the merge is discarded and repeats forever.
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "No changes to push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to staging
        if: steps.changed.outputs.changed == 'true'
        # Staging exists so both platforms can verify this exact commit before
        # main moves. GITHUB_TOKEN pushes fire no events, so nothing runs
        # implicitly — verify/promote/publish below are the only path forward.
        run: git push --force origin HEAD:refs/heads/auto-update

  verify:
    needs: update
    if: needs.update.outputs.changed == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.update.outputs.sha }}

      - uses: DeterminateSystems/determinate-nix-action@v3.21.9

      - name: nix flake check
        run: nix flake check -L

      - name: nix build
        run: nix build .#default -L

      - name: Smoke test
        # A build that produces a non-running binary is not proof.
        run: nix run .#default -- --version

  promote:
    # needs: verify already means a Darwin failure leaves main untouched and
    # the staging branch in place for inspection.
    needs: [update, verify]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # credentials needed to push the verified SHA to main
          ref: ${{ needs.update.outputs.sha }}

      - name: Promote staging SHA to main
        # HEAD is the verified SHA this job checked out; an empty-ref expansion
        # would otherwise delete the branch.
        run: git push origin HEAD:refs/heads/main

      - name: Delete staging branch
        run: git push origin --delete auto-update || true

  publish:
    needs: [update, promote]
    # GITHUB_TOKEN pushes do not fire `push` events, so nix.yml's publish job
    # would never run for these commits. Call the reusable publisher directly.
    if: needs.update.outputs.changed == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/flakehub.yml
    with:
      sha: ${{ needs.update.outputs.sha }}
